services:
  - type: web
    name: tracesky-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: TraceSky-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tracesky-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://trace-sky.vercel.app
      - key: JWT_SECRET_KEY
        value: weatherwise-secret-key-change-in-production
      - key: COOKIE_SECURE
        value: "true"
      - key: REDIS_URL
        value: ""
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: WEATHERAPI_KEY
        sync: false

databases:
  - name: tracesky-db
    plan: free
    databaseName: tracesky
    region: oregon
